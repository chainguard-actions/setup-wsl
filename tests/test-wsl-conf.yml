name: Test WSL conf configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          distribution: Ubuntu-22.04
          use-cache: 'false'
          wsl-conf: |
            [automount]
            enabled = true
            [network]
            generateHosts = true
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step completed with wsl-conf input"
