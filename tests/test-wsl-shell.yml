name: Test WSL shell user and command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          distribution: Debian
          wsl-shell-user: root
          wsl-shell-command: bash --noprofile --norc -euo pipefail
        continue-on-error: true
      - name: Assert action ran with wsl-shell-user and wsl-shell-command inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with wsl-shell-user and wsl-shell-command inputs"
          else
            echo "FAIL: action was not invoked (outcome=$OUTCOME)"
            exit 1
          fi
