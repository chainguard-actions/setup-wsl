name: Test WSL setup with shell configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          distribution: Ubuntu-22.04
          use-cache: 'false'
          wsl-shell-user: root
          wsl-shell-command: bash --noprofile --norc -euo pipefail
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step completed with wsl-shell-user and wsl-shell-command inputs"
